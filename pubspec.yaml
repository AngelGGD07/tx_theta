name: BiPi
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  shared_preferences: ^2.3.2
  firebase_auth: ^5.3.3
  firebase_analytics: ^11.3.5
  flutter_timezone: ^3.0.0
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.5.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  share_plus: ^10.1.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/google.png
    - assets/eye_open.png
    - assets/eye_closed.png
    - assets/google_dark.png
    - assets/microsoft.png